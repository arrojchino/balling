#status.ready{display:none}#status.error{color:#fff}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;width:min(1000px,calc(100% - 24px));display:grid;gap:10px;padding:14px 16px 12px;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.dock.collapsed .more{display:none}
.row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.label{font:600 9px/1 Consolas,Menlo,monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin:0 2px 0 6px}
.finishes{gap:12px}
.swatch{appearance:none;border:0;background:none;color:var(--muted);display:grid;justify-items:center;gap:6px;padding:2px 3px;cursor:pointer;font:600 10px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.swatch i{display:block;width:34px;height:34px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 4px 14px rgba(0,0,0,.4);transition:transform .18s,box-shadow .18s}
.swatch:hover i{transform:translateY(-2px)}
.swatch[aria-checked="true"]{color:var(--ink)}
.swatch[aria-checked="true"] i{box-shadow:0 0 0 2px #050608,0 0 0 4px var(--accent),0 6px 18px rgba(0,0,0,.5)}
.sw-chrome{background:radial-gradient(circle at 32% 28%,#fff 0 8%,#c9d1db 22%,#59616c 52%,#1d2126 70%,#aab4c0 100%)}
.sw-gold{background:radial-gradient(circle at 32% 28%,#fff8e0 0 8%,#ffd77a 24%,#c4891f 52%,#5a3608 72%,#f2c25a 100%)}
.sw-shiny{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 32%),conic-gradient(from 210deg,#ff9ad5,#9ae6ff,#c8ff9a,#ffe29a,#ff9ad5)}
.sw-lava{background:radial-gradient(circle at 40% 40%,#ffe08a 0 6%,#ff7a1a 20%,#a62a06 42%,#2a0c06 64%,#140604 100%)}
.sw-glass{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(200,235,255,.35) 30%,rgba(90,130,170,.25) 62%,rgba(220,245,255,.55) 100%)}
.sw-obsidian{background:radial-gradient(circle at 32% 28%,#8f7dff 0 5%,#2a2440 18%,#0a0a0d 46%,#000 72%,#3a2f6a 100%)}
.sw-neon{background:radial-gradient(circle,#0a0b10 0 52%,transparent 54%),conic-gradient(#00e5ff,#ff2bd6,#00e5ff)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(255,255,255,.03)}
.seg button{appearance:none;border:0;background:none;color:var(--muted);padding:7px 13px;border-radius:999px;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ink);color:#07080b}
.chip{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);padding:7px 12px;border-radius:999px;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.03em;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:rgba(206,222,255,.45);background:rgba(206,222,255,.08)}
.chip[aria-pressed="true"]::before{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.btn{appearance:none;background:#111216;color:#fff;border:1px solid #292c31;border-radius:10px;font:600 12px/1 ui-sans-serif,system-ui,sans-serif;min-height:38px;padding:0 15px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#1e2127;border-color:#6e7582}
.btn.primary{background:var(--ink);color:#06070a;border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn[aria-pressed="true"]{border-color:rgba(206,222,255,.6);color:var(--accent)}
.btn.quiet{background:transparent;color:var(--muted)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.hint{margin:0;text-align:center;font:500 10px/1.5 Consolas,Menlo,monospace;letter-spacing:.05em;color:#6c7380}

<iframe id="stage" title="Still Balling: a three-dimensional sculpture of an ASCII silhouette" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>

<section class="dock" aria-label="Sculpture controls">

    <button class="swatch" type="button" role="radio" aria-checked="false" data-finish="chrome" disabled><i class="sw-chrome"></i>Chrome</button>
    <button class="swatch" type="button" role="radio" aria-checked="true" data-finish="gold" disabled><i class="sw-gold"></i>Gold</button>
    <button class="swatch" type="button" role="radio" aria-checked="false" data-finish="shiny" disabled><i class="sw-shiny"></i>Shiny</button>
    <button class="swatch" type="button" role="radio" aria-checked="false" data-finish="lava" disabled><i class="sw-lava"></i>Lava</button>
    <button class="swatch" type="button" role="radio" aria-checked="false" data-finish="glass" disabled><i class="sw-glass"></i>Glass</button>
    <button class="swatch" type="button" role="radio" aria-checked="false" data-finish="obsidian" disabled><i class="sw-obsidian"></i>Obsidian</button>
    <button class="swatch" type="button" role="radio" aria-checked="false" data-finish="neon" disabled><i class="sw-neon"></i>Neon</button>
  </div>
  <div class="row more">
    <span class="label">Light</span>
    <div class="seg" role="radiogroup" aria-label="Lighting">
      <button type="button" role="radio" aria-checked="true" data-light="studio" disabled>Studio</button>
      <button type="button" role="radio" aria-checked="false" data-light="sunset" disabled>Sunset</button>
      <button type="button" role="radio" aria-checked="false" data-light="club" disabled>Club</button>
      <button type="button" role="radio" aria-checked="false" data-light="noir" disabled>Noir</button>
    </div>
    <span class="label">Effects</span>
    <button class="chip" type="button" aria-pressed="true" data-effect="glow" disabled>Glow</button>
    <button class="chip" type="button" aria-pressed="true" data-effect="sparkles" disabled>Sparkles</button>
    <button class="chip" type="button" aria-pressed="false" data-effect="embers" disabled>Embers</button>
    <button class="chip" type="button" aria-pressed="false" data-effect="halo" disabled>Halo</button>
    <button class="chip" type="button" aria-pressed="false" data-effect="spots" disabled>Spotlights</button>
    <button class="chip" type="button" aria-pressed="false" data-effect="balls" disabled>Ball rain</button>
    <button class="chip" type="button" aria-pressed="false" data-effect="film" disabled>Film</button>
  </div>
  <div class="row">
    <button class="btn primary" id="shuffle" type="button" disabled>Shuffle</button>
    <button class="btn" id="auto" type="button" aria-pressed="false" disabled>Auto</button>
    <button class="btn" id="drop" type="button" disabled>Drop balls</button>
    <button class="btn" id="spin" type="button" aria-pressed="true" disabled>Pause</button>
    <button class="btn" id="reset" type="button" disabled>Reset</button>
    <button class="btn" id="save" type="button" disabled>Save PNG ↗</button>
    <button class="btn quiet" id="more" type="button" aria-expanded="true">Hide controls</button>
  </div>
  <p class="hint more">Drag to spin · Click the sculpture to poke it · Click empty space to throw a ball · Scroll to zoom · S shuffle · Space pause · B balls</p>
</section>

    const b = geometry.boundingBox;
    let k = 0;

      networkPolicy: 'pinned-three-only', contours: parts, finish: current, light: lightName, effects: { ...effects }, auto, balls: balls.length,
      fps: Math.round(fps), dpr: renderer.getPixelRatio(), buildMs: buildMs,
    });
  };
  const exportPNG = () => {
    try {
      let data;
      try {
        sizeTo(2048, 2048, 1);
        placeCamera(2048, 2048, 0, 0, fitDistance(2048, 2048, 0, 0) * zoomNow);
        bgU.uCenter.value.set(.5, .5 + (TARGET.clone().project(camera).y) * .5 + .02);
        composer.render(0);

        resize();
      }
      send('balling-png', { data, width: 2048, height: 2048 });

  };

    if (fatalErrors || e.source !== parent || e.data?.type !== 'balling-command') return;

      case 'reset': reset(); break;
      case 'export': exportPNG(); break;
      case 'visibility': hidden = value === true || e.data.hidden === true; break;
      case 'finish': setFinish(String(value)); break;
      case 'next-finish': { const names = Object.keys(FINISHES); setFinish(names[(names.indexOf(current) + 1) % names.length]); break; }
      case 'light': setLight(String(value)); break;
      case 'next-light': { const names = Object.keys(LIGHTS); setLight(names[(names.indexOf(lightName) + 1) % names.length]); break; }
      case 'effect': if (value && typeof value.name === 'string' && Object.hasOwn(effects, value.name)) effects[value.name] = value.on === true; break;
      case 'shuffle': shuffle(); break;
      case 'auto': auto = value === true && !reduced; autoClock = 0; break;
      case 'drop': dropBalls(16); break;
      case 'insets': insets = { top: clamp(+value?.top || 0, 0, innerHeight * .4), bottom: clamp(+value?.bottom || 0, 0, innerHeight * .5) }; resize(); break;

  // ---------------------------------------------------------------------------
  // 13. Warm up every shader, then run.

  updateLook(10);
  {
    const warm = new THREE.Group();
    for (const name of Object.keys(FINISHES)) { const w = new THREE.Mesh(geometry, material(name)); w.scale.setScalar(.001); warm.add(w); }

    updateBalls(dt);

    embers.material.uniforms.uFade.value = fade.embers; embers.visible = fade.embers > .01;
    haloMat.opacity = fade.halo; halo.visible = fade.halo > .01;
    halo.position.copy(figure.position); ringA.rotation.y = motion.t * .35; ringB.rotation.y = -motion.t * .27;
    orbA.position.set(Math.cos(motion.t * 1.3) * 2.7, Math.sin(motion.t * 1.3) * 2.7, 0); orbB.position.set(Math.cos(-motion.t * 1.05 + 2) * 3.05, Math.sin(-motion.t * 1.05 + 2) * 3.05, 0);

      bm.light.intensity = fade.spots * 340;
      bm.light.target.position.set(Math.sin(motion.t * .55 + bm.i * 2.1) * 2.3, -1.2, Math.cos(motion.t * .42 + bm.i) * 1.3);

    }

    grade.uniforms.uGrain.value = fade.film * .05; grade.uniforms.uCA.value = fade.film; grade.uniforms.uVig.value = .3 + fade.film * .32;
    for (let i = 0; i < BURST; i++) if (bLife[i] > 0) {
      bLife[i] -= dt * 1.1; bVel[i * 3 + 1] -= 4 * dt; const damp = Math.exp(-dt * 1.4);
      bVel[i * 3] *= damp; bVel[i * 3 + 1] *= damp; bVel[i * 3 + 2] *= damp;
      bPos[i * 3] += bVel[i * 3] * dt; bPos[i * 3 + 1] += bVel[i * 3 + 1] * dt; bPos[i * 3 + 2] += bVel[i * 3 + 2] * dt;
    }

    if (transition) {
      transition.t += dt / .95;
      const p = transition.t >= 1 ? 1 : transition.t * transition.t * (3 - 2 * transition.t), v = lerp(-.1, 1.1, p);
      transition.from.userData.u.uDisP.value = v; transition.to.userData.u.uDisP.value = v;

    zoomNow = lerp(zoomNow, zoom, 1 - Math.exp(-dt * 6));
    parXNow = lerp(parXNow, reduced ? 0 : parX, 1 - Math.exp(-dt * 2.5)); parYNow = lerp(parYNow, reduced ? 0 : parY, 1 - Math.exp(-dt * 2.5));
    placeCamera(innerWidth, innerHeight, insets.top, insets.bottom, baseDist * zoomNow);
    tmpV.copy(TARGET).project(camera); bgU.uCenter.value.set(tmpV.x * .5 + .5, tmpV.y * .5 + .55);
    composer.render(dt);
    // Adaptive resolution keeps the frame rate up on slower machines.
    frames++; frameTime += dt;
    if (frameTime >= 1) {
      fps = frames / frameTime; frames = 0; frameTime = 0;
      if (fps < 40 && dpr > .8) { if (++slow >= 2) { dpr = Math.max(.75, dpr - .25); resize(); slow = 0; } } else slow = 0;
      if (fps > 58 && dpr < Math.min(maxDpr, 1.75)) { if (++quick >= 6) { dpr = Math.min(maxDpr, 1.75, dpr + .25); resize(); quick = 0; } } else quick = 0;
    }
    if (now - lastStatus > 1000) { lastStatus = now; status(); }
  };
  status();
  animationFrame = requestAnimationFrame(animate);
} catch (error) { reportError(error); }
</script>
</template>
<script>
(() => {
  const frame = document.querySelector('#stage'), status = document.querySelector('#status'), dock = document.querySelector('.dock'), header = document.querySelector('header');
  const $ = id => document.getElementById(id);
  const spin = $('spin'), reset = $('reset'), save = $('save'), shuffle = $('shuffle'), auto = $('auto'), drop = $('drop'), more = $('more');
  const app = window.__BALLING__ = { status: 'loading', errors: 0 };
  const controls = [...dock.querySelectorAll('button')].filter(b => b !== more);
  const command = (action, value) => { if (app.status === 'error' || !frame.contentWindow) return; frame.contentWindow.postMessage({ type: 'balling-command', action, value }, '*'); };
  const timeout = setTimeout(() => { if (app.status === 'loading') { status.className = 'error'; status.textContent = 'Three.js could not start. Check your internet connection and WebGL support, then reload.'; } }, 25000);
  const sync = () => {
    for (const b of dock.querySelectorAll('[data-finish]')) b.setAttribute('aria-checked', String(b.dataset.finish === app.finish));
    for (const b of dock.querySelectorAll('[data-light]')) b.setAttribute('aria-checked', String(b.dataset.light === app.light));
    for (const b of dock.querySelectorAll('[data-effect]')) b.setAttribute('aria-pressed', String(!!(app.effects && app.effects[b.dataset.effect])));
    auto.setAttribute('aria-pressed', String(!!app.auto));
    spin.textContent = app.spin ? 'Pause' : 'Sway'; spin.setAttribute('aria-pressed', String(!!app.spin));
  };
  let insetsSent = '';
  const sendInsets = () => {
    if (app.status !== 'ready') return;
    const top = Math.round(header.getBoundingClientRect().bottom + 6), bottom = Math.round(innerHeight - dock.getBoundingClientRect().top + 6), next = top + ',' + bottom;
    if (next === insetsSent) return;
    insetsSent = next; command('insets', { top, bottom });
  };
  new ResizeObserver(sendInsets).observe(dock);
  addEventListener('resize', () => { insetsSent = ''; sendInsets(); });
  const handleKey = key => {
    const k = String(key).toLowerCase();
    if (k === ' ') command('spin'); else if (k === 'r') command('reset'); else if (k === 's') command('shuffle'); else if (k === 'm') command('next-finish');
    else if (k === 'l') command('next-light'); else if (k === 'b') command('drop'); else if (k === 'a') command('auto', !app.auto);
  };
  addEventListener('message', event => {
    if (app.status === 'error' || event.source !== frame.contentWindow || !event.data || typeof event.data !== 'object') return;
    const data = event.data;
    if (data.type === 'balling-status' && data.status === 'ready') {
      const first = app.status !== 'ready';
      for (const [k, v] of Object.entries(data)) if (k !== 'type') app[k] = v;
      clearTimeout(timeout);
      if (!app.exportError) status.className = 'ready';
      if (first) { controls.forEach(b => { b.disabled = false; }); sendInsets(); }
      sync();
    } else if (data.type === 'balling-error') {
      app.status = 'error'; app.errors++; clearTimeout(timeout); status.className = 'error';
      status.textContent = 'Could not render: ' + String(data.message || 'WebGL unavailable.').slice(0, 200);
      controls.forEach(b => { b.disabled = true; });
    } else if (data.type === 'balling-export-error') {
      app.exportError = String(data.message || 'PNG export failed.').slice(0, 200); save.disabled = false; save.textContent = 'Save PNG ↗';
      status.className = 'error'; status.textContent = 'Could not save PNG. The viewer is still available; try again.';
    } else if (data.type === 'balling-png' && typeof data.data === 'string' && data.data.length < 24000000 && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(data.data)) {
      app.exportError = ''; status.className = 'ready'; app.lastPNG = data.data; app.lastExport = { width: data.width, height: data.height };
      save.disabled = false; save.textContent = 'Save PNG ↗';
      const link = document.createElement('a'); link.href = data.data; link.download = 'still-balling-3d.png'; link.click();
    } else if (data.type === 'balling-key') handleKey(data.key);
    else if (data.type === 'balling-log') { (app.logs ||= []).push(String(data.level) + ': ' + String(data.message).slice(0, 300)); if (app.logs.length > 20) app.logs.shift(); }
  });
  dock.querySelectorAll('[data-finish]').forEach(b => b.addEventListener('click', () => command('finish', b.dataset.finish)));
  dock.querySelectorAll('[data-light]').forEach(b => b.addEventListener('click', () => command('light', b.dataset.light)));
  dock.querySelectorAll('[data-effect]').forEach(b => b.addEventListener('click', () => command('effect', { name: b.dataset.effect, on: b.getAttribute('aria-pressed') !== 'true' })));
  shuffle.addEventListener('click', () => command('shuffle'));
  auto.addEventListener('click', () => command('auto', auto.getAttribute('aria-pressed') !== 'true'));
  drop.addEventListener('click', () => command('drop'));
  spin.addEventListener('click', () => command('spin'));
  reset.addEventListener('click', () => command('reset'));
  save.addEventListener('click', () => { save.disabled = true; save.textContent = 'Rendering…'; command('export'); });
  more.addEventListener('click', () => {
    const open = more.getAttribute('aria-expanded') !== 'true';
    more.setAttribute('aria-expanded', String(open)); dock.classList.toggle('collapsed', !open); more.textContent = open ? 'Hide controls' : 'Show controls';
  });
  addEventListener('keydown', event => {
    if (event.target instanceof HTMLButtonElement || event.ctrlKey || event.metaKey || event.altKey) return;
    if (event.code === 'Space') event.preventDefault();
    handleKey(event.key);
  });
  document.addEventListener('visibilitychange', () => { if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'balling-command', action: 'visibility', value: document.hidden, hidden: document.hidden }, '*'); });
  frame.srcdoc = document.querySelector('#scene-source').innerHTML;
})();
</script>
