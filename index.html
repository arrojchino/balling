<script type="module">
const send = (type, data = {}) => parent.postMessage({type, ...data}, '*');

  const { OutputPass } = await import('three/addons/postprocessing/OutputPass.js');
  const { ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js');
  if(fatalErrors)throw new Error('Scene stopped after a fatal error.');
  const rows = document.querySelector('#ascii').textContent.trim().split(/\r?\n/);
  const W = Math.max(...rows.map(row => row.length)) * 2, H = rows.length * 4;
  const mask = new Uint8Array(W * H);
  const dots = [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[0,3],[1,3]];
  for (let row = 0; row < rows.length; row++) {
    for (let col = 0; col < rows[row].length; col++) {
      const bits = rows[row].charCodeAt(col) - 0x2800;
      if (bits < 0 || bits > 255) throw new Error('Unsupported source character.');
      for (let bit = 0; bit < 8; bit++) if (bits & (1 << bit)) mask[(row * 4 + dots[bit][1]) * W + col * 2 + dots[bit][0]] = 1;
    }
  }
  // Trace the occupied braille cells, keeping disconnected details and holes.
  const edges = [], starts = new Map();
  const key = (x, y) => y * (W + 1) + x;
  const occupied = (x, y) => x >= 0 && y >= 0 && x < W && y < H && mask[y * W + x] === 1;
  const edge = (ax, ay, bx, by) => {
    const id = edges.length;
    edges.push({a:[ax,ay], b:[bx,by], used:false});
    const k = key(ax,ay);
    if (!starts.has(k)) starts.set(k, []);
    starts.get(k).push(id);
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (occupied(x,y)) {
    if (!occupied(x,y-1)) edge(x,y,x+1,y);
    if (!occupied(x+1,y)) edge(x+1,y,x+1,y+1);
    if (!occupied(x,y+1)) edge(x+1,y+1,x,y+1);
    if (!occupied(x-1,y)) edge(x,y+1,x,y);

    if (edges[first].used) continue;
    const points = []; let current = first, closed = false;

      const e = edges[current]; e.used = true; points.push(e.a);
      if (e.b[0] === edges[first].a[0] && e.b[1] === edges[first].a[1]) { closed = true; break; }
      const next = (starts.get(key(...e.b)) || []).filter(id => !edges[id].used);

<script>
(() => {

    if(app.status==='error'||event.source!==frame.contentWindow||!event.data||typeof event.data!=='object')return;
    const data=event.data;
    if(data.type==='balling-status'&&data.status==='ready'){
      for(const key of ['status','revision','sourceRows','vertices','depth','inFrame','errors','spin','yaw','pitch','zoom','networkPolicy','contours'])if(Object.hasOwn(data,key))app[key]=data[key];
      clearTimeout(timeout);if(!app.exportError)status.className='ready';[spin,reset,save].forEach(button=>button.disabled=false);spin.textContent=data.spin?'Pause rotation':'Rotate';spin.setAttribute('aria-pressed',String(data.spin));

      [spin,reset,save].forEach(button=>button.disabled=true);

      app.exportError=String(data.message||'PNG export failed.').slice(0,200);save.disabled=false;save.textContent='Save PNG ↗';

    } else if(data.type==='balling-png'&&typeof data.data==='string'&&data.data.length<16000000&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(data.data)){
      app.exportError='';status.className='ready';app.lastPNG=data.data;app.lastExport={width:data.width,height:data.height};save.disabled=false;save.textContent='Save PNG ↗';
      const link=document.createElement('a');link.href=data.data;link.download='still-balling-3d.png';link.click();
    }

  reset.addEventListener('click',()=>command('reset'));
  save.addEventListener('click',()=>{save.disabled=true;save.textContent='Rendering…';command('export');});
